name: Nieuwe versie

# Bij elke wijziging op main: het installatiebestand (kassa-installatie.run) bouwen en als
# TESTVERSIE (pre-release) publiceren. Kassa's van klanten zien die nog niet: zij kijken naar
# releases/latest, en daar telt een testversie niet mee. Probeer de nieuwe versie eerst in de
# proefversie (die werkt zich bij elke wijziging vanzelf bij) en breng hem daarna uit met de
# workflow "Uitbrengen" (Actions → Uitbrengen → Run workflow).
#
# De code is privé; de installatiebestanden staan (ook) in de publieke repo Jlmree/tapkas-releases,
# zodat kassa's ze zonder inloggen kunnen ophalen. Daarvoor is het geheim TAPKAS_RELEASES_TOKEN
# nodig: een token dat alleen in tapkas-releases mag schrijven (Contents: read and write).
# Downloaden (uitgebrachte versie): https://github.com/Jlmree/tapkas-releases/releases/latest/download/kassa-installatie.run
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: server/pakket.sh "v${{ github.run_number }}"
      - name: Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.TAPKAS_RELEASES_TOKEN }}
        run: |
          [ -n "$RELEASES_TOKEN" ] || { echo "::error::Het geheim TAPKAS_RELEASES_TOKEN ontbreekt (Settings → Secrets and variables → Actions)."; exit 1; }
          # Releasetekst: het nieuwste punt uit src/wijzigingen.json, plus hoe je installeert.
          node -e '
            const [w] = require("./src/wijzigingen.json");
            console.log(`## ${w.titel}\n\n${w.punten.map((p) => "- " + p).join("\n")}\n`);
            console.log("**Testversie.** Kassa\u2019s zien deze versie pas na Uitbrengen (Actions \u2192 Uitbrengen).\n");
            console.log("Installeren: download kassa-installatie.run en start als root: `bash kassa-installatie.run`.");
            console.log("Bijwerken: in de app bij Beheer → Instellingen, of op de kassa-server: `/opt/kassa/bin/bijwerken.sh`.");
          ' > notities.md
          cp src/wijzigingen.json wijzigingen.json
          gh release create "v${{ github.run_number }}" kassa-installatie.run wijzigingen.json \
            --title "Tapkas v${{ github.run_number }} (test)" --notes-file notities.md --prerelease
          # Dezelfde versie in de publieke repo, waar de kassa's hun updates halen.
          GH_TOKEN=$RELEASES_TOKEN gh release create "v${{ github.run_number }}" kassa-installatie.run wijzigingen.json \
            --repo Jlmree/tapkas-releases --title "Tapkas v${{ github.run_number }} (test)" --notes-file notities.md --prerelease
