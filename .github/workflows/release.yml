name: Nieuwe versie

# Bij elke wijziging op main: het installatiebestand (kassa-installatie.run) bouwen en als release publiceren.
# Downloaden: https://github.com/<repo>/releases/latest/download/kassa-installatie.run
# De kassa-server werkt zichzelf bij met: /opt/kassa/bin/bijwerken.sh
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: server/pakket.sh "v${{ github.run_number }}"
      - name: Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" kassa-installatie.run \
            --title "Bar-kassa v${{ github.run_number }}" \
            --notes "Installeren: download kassa-installatie.run en start als root: \`bash kassa-installatie.run\`. Bijwerken op de kassa-server: \`/opt/kassa/bin/bijwerken.sh\`."
