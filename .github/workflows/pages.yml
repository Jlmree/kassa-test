name: Publiceren op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Optioneel: zet SUPABASE_URL en SUPABASE_ANON_KEY als repository-variabelen
      # (Settings → Secrets and variables → Actions → Variables) in plaats van public/config.js te bewerken.
      - name: Supabase-gegevens invullen
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != ''
        run: |
          printf "window.KASSA_CONFIG = { supabaseUrl: '%s', supabaseAnonKey: '%s' };\n" "${{ vars.SUPABASE_URL }}" "${{ vars.SUPABASE_ANON_KEY }}" > dist/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
