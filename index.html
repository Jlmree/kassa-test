<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar-kassa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ef;--card:#fff;--ink:#1b2927;--mu:#62706c;--line:#d9dfd8;--acc:#1d6b58;--ai:#fff;--sun:#f0b429;--warn:#b23a26;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101817;--card:#1a2423;--ink:#e8efec;--mu:#93a39e;--line:#2b3836;--acc:#4fb89c;--ai:#08201a;--warn:#ef8a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101817;--card:#1a2423;--ink:#e8efec;--mu:#93a39e;--line:#2b3836;--acc:#4fb89c;--ai:#08201a;--warn:#ef8a74;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
header b{font-size:20px;font-weight:800;flex:1}
header input{width:46%;max-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
main{flex:1;overflow:auto;padding:12px 14px 18px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;padding:12px 2px;font-size:14px;font-weight:600;color:var(--mu)}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chips button{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.97)}
.tile .nm{font-weight:600;font-size:17px}
.tile .pr{color:var(--mu)}
.bd{position:absolute;top:8px;right:8px;background:var(--sun);color:#1b2927;font-style:normal;font-weight:800;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;padding:0 6px}
#cartbar{padding:0 14px 10px}
.cart{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--acc);color:var(--ai);padding:14px 16px;border-radius:14px;font-weight:600}
.cart b{font-size:20px}
.banner{display:flex;justify-content:space-between;align-items:center;background:var(--sun);color:#1b2927;padding:8px 12px;border-radius:12px;margin-bottom:10px;font-weight:600}
.banner button{font-weight:800;text-decoration:underline}
.mu{color:var(--mu)}
.c{text-align:center}
h2{margin:6px 0 10px;font-size:22px;font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row>span:first-child{flex:1}
.rt{min-width:70px;text-align:right}
.tot{font-size:19px;border-bottom:0}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
.big{width:100%;padding:15px;border-radius:14px;background:var(--acc);color:var(--ai);font-weight:800;font-size:18px;margin-top:10px}
.big.alt{background:var(--ink);color:var(--bg)}
.big.m-cash{background:#2e7d32;color:#fff}.big.m-pin{background:#1565c0;color:#fff}.big.m-card{background:#f0b429;color:#1b2927}.big.m-tab{background:#7b3fa0;color:#fff}
.ghost{width:100%;padding:12px;margin-top:6px;color:var(--mu);font-weight:600}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.btns button{padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btns .big{margin:0;border:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card .hd{display:flex;justify-content:space-between;font-weight:600;font-size:18px;margin-bottom:8px}
label{display:block;margin:10px 0 4px;font-weight:600}
.f{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.inl{display:flex;gap:8px}
.inl button{padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:26px;font-weight:800}
h3.s{margin:18px 0 4px;font-size:16px}
.vd{opacity:.45;text-decoration:line-through}
.big-n{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.quick button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.chg{min-height:28px;font-size:20px;font-weight:800;text-align:center;color:var(--acc);margin:8px 0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
#sheet[hidden]{display:none}
.sh{width:100%;max-height:90%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.bon{background:#fff;color:#111;border:1px dashed #999;border-radius:6px;padding:16px;margin:8px 0 12px;font-family:"Courier New",monospace;font-size:14px}
.bon h3{margin:0;text-align:center;font-size:20px}
.bon p{margin:4px 0}
.bon .mu{color:#555}
.bl{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.bl.tt{border-top:1px dashed #555;margin-top:6px;padding-top:6px;font-size:16px}
.stamp{color:#b23a26;text-align:center;font-weight:800;border:2px solid #b23a26;padding:2px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;font-weight:600}
#toast[hidden]{display:none}
textarea{width:100%;height:180px;font:12px monospace;border-radius:10px;padding:8px}
.qrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qc{background:#fff;color:#111;border:1px dashed #999;padding:6px;text-align:center;break-inside:avoid}.qc svg{width:100%;height:auto;display:block}.qc b{font-size:13px}.pg{border:0;padding:0;background:none}
@media print{.app{display:none!important}.sh>:not(.bon){display:none!important}#sheet{position:static;background:none}.sh{padding:0;max-height:none}.bon{border:0}}
</style></head><body>
<div class="app">
<header><b id="ttl">Bar-kassa</b><input id="by" placeholder="Wie staat er achter de bar?" aria-label="Bediend door"></header>
<main id="main"></main>
<div id="cartbar"></div>
<nav><button data-act="nav" data-id="kassa">Kassa</button><button data-act="nav" data-id="tabs">Rekeningen</button><button data-act="nav" data-id="kaarten">Kaarten</button><button data-act="nav" data-id="dag">Dag</button><button data-act="nav" data-id="menu">Menu</button></nav>
</div>
<div id="sheet" hidden></div><div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n/100);
const cents=v=>Math.round(parseFloat(String(v).replace(',','.'))*100)||0;
const total=L=>L.reduce((a,i)=>a+i.p*i.q,0);
const day=ts=>new Date(ts).toLocaleDateString('sv-SE');
const KEY='bar-kassa-v1';
const seed=()=>({shop:'Bar',by:'',seq:0,nid:20,tabs:[],sales:[],products:[
{id:'p1',name:'Tosti kaas',price:200,cat:'Eten',on:1},{id:'p2',name:'Tosti ham-kaas',price:250,cat:'Eten',on:1},
{id:'p3',name:'Bapao',price:200,cat:'Eten',on:1},{id:'p4',name:'Frisdrank',price:150,cat:'Drinken',on:1},
{id:'p5',name:'Bier',price:200,cat:'Drinken',on:1},{id:'p6',name:'Wijn',price:250,cat:'Drinken',on:1},
{id:'p7',name:'Koffie',price:100,cat:'Drinken',on:1},{id:'p8',name:'Chips',price:100,cat:'Snacks',on:1}]});
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),view='kassa',cat='',cart={},target=null,pay=null,dd=day(Date.now());
let stream=null,raf=0,scanFor='pay',lastBad=0;
function fix(){S.cards=S.cards||[];S.tops=S.tops||[];S.cseq=S.cseq||0}fix();

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800)}
function sheet(h){$('#sheet').innerHTML='<div class="sh"><div class="grab"></div>'+h+'</div>';$('#sheet').hidden=false}
function closeSheet(){stopScan();$('#sheet').hidden=true}
function cartLines(){return Object.entries(cart).map(([id,q])=>{const p=S.products.find(x=>x.id===id);return p?{id,n:p.name,p:p.price,q}:null}).filter(Boolean)}
function setPay(src,id){
  if(src==='tab'){const t=S.tabs.find(x=>x.id===id);pay={items:t.items,total:total(t.items),full:total(t.items),tab:id,name:t.name}}
  else{const L=cartLines();pay={items:L.map(({n,p,q})=>({n,p,q})),total:total(L),full:total(L),tab:null,name:''}}
}
function bonHtml(s){
  const d=new Date(s.ts);
  return `<div class="bon"><h3>${esc(S.shop)}</h3>
  <p class="mu c">${d.toLocaleDateString('nl-NL')} ${d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</p>
  ${s.no?`<p class="mu c">Bon ${s.no}</p>`:'<p class="mu c">Rekening</p>'}
  ${s.name?`<p class="c">Rekening van ${esc(s.name)}</p>`:''}
  ${s.void?'<p class="stamp">GEANNULEERD</p>':''}
  ${s.items.map(i=>`<div class="bl"><span>${i.q}× ${esc(i.n)}</span><span>${eur(i.p*i.q)}</span></div>`).join('')}
  <div class="bl tt"><b>Totaal</b><b>${eur(s.total)}</b></div>
  ${s.method?`<div class="bl"><span>Betaald met ${s.method.toLowerCase()}</span><span></span></div>`:''}
  ${s.given?`<div class="bl"><span>Gegeven</span><span>${eur(s.given)}</span></div><div class="bl"><span>Wisselgeld</span><span>${eur(s.change)}</span></div>`:''}
  ${s.by?`<p class="mu c">Bediend door ${esc(s.by)}</p>`:''}
  ${s.card?`<div class="bl"><span>Saldo kaart ${s.card}</span><span>${eur(s.cardLeft)}</span></div>`:''}<p class="mu c">Bedankt!</p></div>`;
}
function docOf(id){
  if(id.startsWith('tab:')){const t=S.tabs.find(x=>x.id===id.slice(4));return {ts:Date.now(),items:t.items,total:total(t.items),name:t.name,by:S.by}}
  return S.sales.find(x=>x.id===id);
}
function bonText(s){
  const d=new Date(s.ts);
  return [S.shop,d.toLocaleString('nl-NL'),s.no?'Bon '+s.no:'Rekening',s.name?'Rekening van '+s.name:'',''].filter((x,i)=>x||i>3)
   .concat(s.items.map(i=>`${i.q}× ${i.n}  ${eur(i.p*i.q)}`),['','Totaal: '+eur(s.total)],s.method?['Betaald met '+s.method.toLowerCase()]:[]).join('\n');
}
function showBon(s,fresh,sid){
  sheet(bonHtml(s)+`<div class="btns"><button data-act="share" data-id="${sid||s.id}">Delen</button><button data-act="print">Print of PDF</button></div>`+
   (fresh?'<button class="big" data-act="close">Nieuwe bestelling</button>':(s.void?'':`<button class="ghost" data-act="void" data-id="${s.id}">Verkoop annuleren</button>`)));
}

/* views */
function vKassa(){
  const ps=S.products.filter(p=>p.on),cats=[...new Set(ps.map(p=>p.cat))];
  if(!cats.includes(cat))cat=cats[0]||'';
  const tg=target&&S.tabs.find(x=>x.id===target);
  return (tg?`<div class="banner"><span>Bestelling voor ${esc(tg.name)}</span><button data-act="stopTarget">Stoppen</button></div>`:'')+
  `<div class="chips">${cats.map(c=>`<button class="${c===cat?'on':''}" data-act="cat" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="grid">${ps.filter(p=>p.cat===cat).map(p=>`<button class="tile" data-act="add" data-id="${p.id}"><span class="nm">${esc(p.name)}</span><span class="pr">${eur(p.price)}</span>${cart[p.id]?`<i class="bd">${cart[p.id]}</i>`:''}</button>`).join('')}</div>
  ${ps.length?'':'<p class="mu">Nog geen producten. Voeg ze toe bij Menu.</p>'}`;
}
function vTabs(){
  return `<div class="inl"><input class="f" id="ntn" placeholder="Naam voor nieuwe rekening"><button data-act="newtab">Maak aan</button></div>
  <div style="height:12px"></div>
  ${S.tabs.length?S.tabs.map(t=>`<button class="card" style="width:100%;text-align:left" data-act="tab" data-id="${t.id}"><div class="hd" style="margin:0"><span>${esc(t.name)}</span><span>${eur(total(t.items))}</span></div><span class="mu">${t.items.reduce((a,i)=>a+i.q,0)} artikelen</span></button>`).join(''):'<p class="mu">Geen openstaande rekeningen. Maak er een aan met een naam, of zet een bestelling op rekening.</p>'}`;
}
function vDag(){
  const L=S.sales.filter(s=>day(s.ts)===dd),ok=L.filter(s=>!s.void);
  const T=ok.reduce((a,s)=>a+s.total,0),bm={},bp={};
  ok.forEach(s=>{(s.parts||[{m:s.method,a:s.total}]).forEach(p=>bm[p.m]=(bm[p.m]||0)+p.a);s.items.forEach(i=>{const o=bp[i.n]||(bp[i.n]={q:0,t:0});o.q+=i.q;o.t+=i.p*i.q})});
  const open=S.tabs.reduce((a,t)=>a+total(t.items),0);
  const rows=o=>Object.entries(o).map(([k,v])=>`<div class="row"><span>${esc(k)}${v.q?` (${v.q}×)`:''}</span><span class="rt">${eur(v.t??v)}</span></div>`).join('')||'<p class="mu">Niets</p>';
  return `<input type="date" class="f" id="dd" value="${dd}">
  <div class="kpi"><div><span class="mu">Omzet</span><b>${eur(T)}</b></div><div><span class="mu">Bonnen</span><b>${ok.length}</b></div></div>
  ${open?`<p class="mu">Nog open op rekeningen: ${eur(open)}</p>`:''}
  <h3 class="s">Per betaalmethode</h3>${rows(bm)}
  <h3 class="s">Opgewaardeerd op kaarten</h3>${rows(S.tops.filter(t=>day(t.ts)===dd).reduce((o,t)=>(o[t.m]=(o[t.m]||0)+t.amt,o),{}))}
  <h3 class="s">Per product</h3>${rows(bp)}
  <h3 class="s">Bonnen</h3>${L.slice().reverse().map(s=>`<button class="row ${s.void?'vd':''}" data-act="bon" data-id="${s.id}"><span>${new Date(s.ts).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})} Bon ${s.no}${s.name?', '+esc(s.name):''}</span><span>${esc(s.method)}</span><span class="rt">${eur(s.total)}</span></button>`).join('')||'<p class="mu">Nog geen verkopen op deze dag.</p>'}
  <button class="big alt" data-act="csv">Alle verkopen als CSV</button>`;
}
function vMenu(){
  return `<label for="shop">Naam op de bon</label><input class="f" id="shop" value="${esc(S.shop)}">
  <h3 class="s">Producten</h3>
  ${S.products.map(p=>`<button class="row ${p.on?'':'vd'}" data-act="editp" data-id="${p.id}"><span>${esc(p.name)}</span><span class="mu">${esc(p.cat)}</span><span class="rt">${eur(p.price)}</span></button>`).join('')}
  <button class="big" data-act="editp" data-id="new">Nieuw product</button>`;
}
function renderCartbar(){
  const el=$('#cartbar'),L=cartLines();
  if(view!=='kassa'||!L.length){el.innerHTML='';return}
  const n=L.reduce((a,l)=>a+l.q,0);
  el.innerHTML=`<button class="cart" data-act="cartopen"><span>${n} ${n>1?'artikelen':'artikel'}</span><b>${eur(total(L))}</b><span>Bestelling</span></button>`;
}
function render(){
  $('#main').innerHTML=({kassa:vKassa,tabs:vTabs,kaarten:vKaarten,dag:vDag,menu:vMenu})[view]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===view));
  renderCartbar();
}

/* sheets */
function openCart(){
  const L=cartLines();if(!L.length){closeSheet();return}
  const tg=target&&S.tabs.find(x=>x.id===target);
  sheet(`<h2>Bestelling</h2>${tg?`<p class="mu">Voor rekening van ${esc(tg.name)}</p>`:''}
  ${L.map(l=>`<div class="row"><span>${esc(l.n)}</span><span class="qty"><button data-act="dec" data-id="${l.id}" aria-label="Minder">−</button><b>${l.q}</b><button data-act="inc" data-id="${l.id}" aria-label="Meer">+</button></span><span class="rt">${eur(l.p*l.q)}</span></div>`).join('')}
  <div class="row tot"><b>Totaal</b><b>${eur(total(L))}</b></div>
  ${tg?`<button class="big" data-act="addtotab" data-id="${tg.id}">Zet op rekening van ${esc(tg.name)}</button>`:
  `<div class="btns"><button class="big m-cash" data-act="cash" data-src="cart">Contant</button><button class="big m-pin" data-act="pin" data-src="cart">Pin</button><button class="big m-card" data-act="paycard" data-src="cart">Kaart</button><button class="big m-tab" data-act="ontab">Op rekening</button></div>`}
  <button class="ghost" data-act="clear">Bestelling wissen</button>`);
}
function openCash(){
  const t=pay.total,q=[...new Set([t,500,1000,2000,5000].filter(v=>v>=t))].slice(0,5);
  sheet(`<h2>Contant</h2><div class="big-n">${eur(t)}</div>
  <div class="quick">${q.map(v=>`<button data-act="given" data-v="${v}">${v===t?'Gepast':eur(v)}</button>`).join('')}</div>
  <label for="given">Gegeven bedrag</label><input class="f" id="given" inputmode="decimal" placeholder="0,00">
  <div class="chg" id="chg"></div><button class="big m-cash" data-act="fincash">Afronden</button>`);
  $('#given').addEventListener('input',updChg);
}
function updChg(){
  const v=$('#given').value,g=cents(v),e=$('#chg');
  e.textContent=!v?'':g>=pay.total?'Wisselgeld: '+eur(g-pay.total):'Nog '+eur(pay.total-g)+' tekort';
}
function finish(method,extra){
  const parts=[];if(pay.card)parts.push({m:'Kaart',a:pay.card.amt});if(method)parts.push({m:method,a:pay.total});
  const s={id:'s'+Date.now(),no:++S.seq,ts:Date.now(),items:pay.items.map(i=>({...i})),total:pay.full,name:pay.name,method:parts.map(p=>p.m).join(' + '),parts,by:S.by,...extra};
  if(pay.card){const c=S.cards.find(x=>x.id===pay.card.id);c.bal-=pay.card.amt;s.card=c.id;s.cardLeft=c.bal}
  S.sales.push(s);
  if(pay.tab)S.tabs=S.tabs.filter(x=>x.id!==pay.tab);else cart={};
  target=null;save();render();showBon(s,true);
}
function addToTab(id){
  const t=S.tabs.find(x=>x.id===id);
  cartLines().forEach(l=>{const m=t.items.find(i=>i.n===l.n&&i.p===l.p);m?m.q+=l.q:t.items.push({n:l.n,p:l.p,q:l.q})});
  cart={};target=null;save();closeSheet();render();toast('Op rekening van '+t.name);
}
function openTab(id){
  const t=S.tabs.find(x=>x.id===id),has=t.items.length>0;
  sheet(bonHtml({ts:Date.now(),items:t.items,total:total(t.items),name:t.name,by:S.by})+
  `<button class="ghost" style="margin:0 0 6px" data-act="addto" data-id="${id}">Bestelling toevoegen</button>`+
  (has?`<div class="btns"><button class="big m-cash" data-act="cash" data-src="tab" data-id="${id}">Contant</button><button class="big m-pin" data-act="pin" data-src="tab" data-id="${id}">Pin</button><button class="big m-card" data-act="paycard" data-src="tab" data-id="${id}">Kaart</button></div><div class="btns" style="margin-top:8px"><button data-act="share" data-id="tab:${id}">Delen</button><button data-act="print">Print of PDF</button></div>`:
  `<button class="ghost" data-act="deltab" data-id="${id}">Lege rekening verwijderen</button>`));
}
function editP(id){
  const p=id==='new'?{name:'',price:0,cat:cat||'Eten',on:1}:S.products.find(x=>x.id===id);
  sheet(`<h2>${id==='new'?'Nieuw product':'Product'}</h2>
  <label for="pn">Naam</label><input class="f" id="pn" value="${esc(p.name)}">
  <label for="pp">Prijs in euro</label><input class="f" id="pp" inputmode="decimal" value="${p.price?(p.price/100).toFixed(2).replace('.',','):''}">
  <label for="pc">Categorie</label><input class="f" id="pc" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(S.products.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label><input type="checkbox" id="pv" ${p.on?'checked':''}> Tonen in de kassa</label>
  <button class="big" data-act="savep" data-id="${id}">Opslaan</button>
  ${id==='new'?'':`<button class="ghost" data-act="delp" data-id="${id}">Product verwijderen</button>`}`);
}
function csv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['bon','datum','tijd','methode','rekening','bediend door','totaal','geannuleerd','regels'].join(';')].concat(S.sales.map(s=>{const d=new Date(s.ts);
    return [s.no,day(s.ts),d.toLocaleTimeString('nl-NL'),s.method,s.name||'',s.by||'',(s.total/100).toFixed(2).replace('.',','),s.void?'ja':'',s.items.map(i=>i.q+'x '+i.n).join(', ')].map(q).join(';')}));
  sheet(`<h2>CSV</h2><textarea id="csvt" readonly>${esc(rows.join('\n'))}</textarea><button class="big" data-act="copycsv">Kopieer</button>`);
}

/* kaarten */
const qrSvg=t=>{try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:3,margin:2,scalable:true})}catch(e){return '<span>QR niet beschikbaar</span>'}};
const qrCell=id=>`<div class="qc">${qrSvg(id)}<b>${id}</b></div>`;
function vKaarten(){
  const L=S.cards.filter(c=>c.bal>0||c.blocked);
  return `<div class="kpi"><div><span class="mu">Kaarten</span><b>${S.cards.length}</b></div><div><span class="mu">Tegoed in omloop</span><b>${eur(S.cards.reduce((a,c)=>a+c.bal,0))}</b></div></div>
  <button class="big" style="margin:0 0 8px" data-act="scan" data-f="look">Kaart scannen of typen</button>
  <div class="btns"><button data-act="newcards">Nieuwe kaarten maken</button><button data-act="backup">Back-up</button></div>
  <h3 class="s">Kaarten met tegoed</h3>
  ${L.map(c=>`<button class="row ${c.blocked?'vd':''}" data-act="opencard" data-id="${c.id}"><span>${c.id}</span><span class="rt">${eur(c.bal)}</span></button>`).join('')||'<p class="mu">Nog geen kaarten met tegoed.</p>'}`;
}
function openScan(f){stopScan();scanFor=f;sheet(`<h2>Kaart scannen</h2><video id="vid" playsinline muted style="width:100%;border-radius:12px;background:#000;min-height:150px"></video><label for="cc">Of typ het kaartnummer</label><div class="inl"><input class="f" id="cc" placeholder="BK-0001 of 1"><button data-act="code">OK</button></div>`);startScan()}
async function startScan(){
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Camera niet beschikbaar, typ het nummer');return}
  const v=$('#vid');if(!v){stopScan();return}
  v.srcObject=stream;try{await v.play()}catch(e){}
  const bd=window.BarcodeDetector?new BarcodeDetector({formats:['qr_code']}):null,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let busy=false;
  const tick=async()=>{
    if(!stream)return;
    if(v.videoWidth&&!busy){busy=true;let val='';
      try{if(bd){const r=await bd.detect(v);val=r[0]?r[0].rawValue:''}
      else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(im.data,im.width,im.height);val=r?r.data:''}}catch(e){}
      busy=false;if(val&&stream)handleCode(val)}
    if(stream)raf=requestAnimationFrame(tick)};
  tick();
}
function stopScan(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function handleCode(raw){
  let c=String(raw).trim().toUpperCase();if(/^\d+$/.test(c))c='BK-'+c.padStart(4,'0');
  const k=S.cards.find(x=>x.id===c);
  if(!k){if(Date.now()-lastBad>2000){lastBad=Date.now();toast('Kaart '+c+' niet gevonden')}return}
  stopScan();scanFor==='pay'?payCard(k.id):openCard(k.id);
}
function payCard(id){
  const c=S.cards.find(x=>x.id===id);
  if(c.blocked){sheet(`<h2>${id}</h2><p class="stamp">GEBLOKKEERD</p><button class="ghost" data-act="close">Sluiten</button>`);return}
  const use=Math.min(c.bal,pay.full);
  if(use<=0){sheet(`<h2>${id}</h2><div class="big-n">${eur(c.bal)}</div><p class="mu c">Geen tegoed op deze kaart.</p><button class="ghost" data-act="close">Sluiten</button>`);return}
  pay.card={id,amt:use};pay.total=pay.full-use;
  sheet(`<h2>Kaart ${id}</h2><div class="row"><span>Saldo</span><b>${eur(c.bal)}</b></div><div class="row"><span>Te betalen</span><b>${eur(pay.full)}</b></div><div class="row tot"><span>Van kaart</span><b>${eur(use)}</b></div>
  ${pay.total?`<div class="row"><span>Nog te betalen</span><b>${eur(pay.total)}</b></div><div class="btns"><button class="big m-cash" data-act="cash2">Rest contant</button><button class="big m-pin" data-act="pinS">Rest pin</button></div>`:'<button class="big m-card" data-act="fincard">Afschrijven</button>'}`);
}
function openCard(id){
  const c=S.cards.find(x=>x.id===id);
  sheet(`<h2>${c.id}</h2><div class="big-n">${eur(c.bal)}</div>${c.blocked?'<p class="stamp">GEBLOKKEERD</p>':''}
  <label for="ta">Opwaarderen</label><div class="quick">${[500,1000,2000].map(v=>`<button data-act="ta" data-v="${v}">${eur(v)}</button>`).join('')}</div>
  <input class="f" id="ta" inputmode="decimal" placeholder="Ander bedrag, bijvoorbeeld 7,50">
  <div class="btns" style="margin-top:8px"><button class="big m-cash" data-act="topup" data-id="${id}" data-m="Contant">Contant ontvangen</button><button class="big m-pin" data-act="topup" data-id="${id}" data-m="Pin">Pin ontvangen</button></div>
  <div class="bon pg qrs" style="grid-template-columns:1fr;max-width:150px;margin:14px auto">${qrCell(id)}</div>
  <button class="ghost" data-act="blk" data-id="${id}">${c.blocked?'Blokkade opheffen':'Kaart blokkeren'}</button>`);
}
/* actions */
const H={
 nav:b=>{view=b.dataset.id;if(view!=='kassa')target=null;render()},
 cat:b=>{cat=b.dataset.id;render()},
 add:b=>{cart[b.dataset.id]=(cart[b.dataset.id]||0)+1;render()},
 inc:b=>{cart[b.dataset.id]++;render();openCart()},
 dec:b=>{const i=b.dataset.id;if(--cart[i]<=0)delete cart[i];render();openCart()},
 cartopen:openCart,
 clear:()=>{cart={};target=null;closeSheet();render()},
 close:closeSheet,
 stopTarget:()=>{target=null;render()},
 cash:b=>{setPay(b.dataset.src,b.dataset.id);openCash()},
 given:b=>{$('#given').value=(b.dataset.v/100).toFixed(2).replace('.',',');updChg()},
 fincash:()=>{const v=$('#given').value,g=v?cents(v):pay.total;if(g<pay.total){updChg();return}finish('Contant',{given:g,change:g-pay.total})},
 pin:b=>{setPay(b.dataset.src,b.dataset.id);H.pinS()},
 pinS:()=>{sheet(`<h2>Pin</h2><div class="big-n">${eur(pay.total)}</div><p class="mu c">Laat de klant betalen en tik daarna op afronden.</p><button class="big m-pin" data-act="finpin">Pin gelukt, afronden</button>`)},
 finpin:()=>finish('Pin'),
 ontab:()=>sheet(`<h2>Op rekening</h2>${S.tabs.map(t=>`<button class="row" data-act="addtotab" data-id="${t.id}"><span>${esc(t.name)}</span><span class="rt">${eur(total(t.items))}</span></button>`).join('')}
   <label for="ntn2">Of een nieuwe naam</label><div class="inl"><input class="f" id="ntn2" placeholder="Naam"><button data-act="newtab" data-from="cart">Maak aan</button></div>`),
 addtotab:b=>addToTab(b.dataset.id),
 newtab:b=>{
  const el=$(b.dataset.from?'#ntn2':'#ntn'),n=el.value.trim();if(!n){toast('Vul eerst een naam in');return}
  const t={id:'t'+Date.now(),name:n,items:[],ts:Date.now()};S.tabs.push(t);save();
  if(b.dataset.from)addToTab(t.id);else render();
 },
 tab:b=>openTab(b.dataset.id),
 addto:b=>{target=b.dataset.id;view='kassa';closeSheet();render()},
 deltab:b=>{S.tabs=S.tabs.filter(x=>x.id!==b.dataset.id);save();closeSheet();render()},
 bon:b=>showBon(S.sales.find(x=>x.id===b.dataset.id),false),
 void:b=>{const s=S.sales.find(x=>x.id===b.dataset.id);s.void=1;if(s.card){const c=S.cards.find(x=>x.id===s.card),k=(s.parts||[]).find(p=>p.m==='Kaart');if(c&&k)c.bal+=k.a}save();closeSheet();render();toast('Verkoop geannuleerd')},
 print:()=>window.print(),
 share:async b=>{
  const s=docOf(b.dataset.id),t=bonText(s);
  try{if(navigator.share){await navigator.share({title:'Bon',text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Bon gekopieerd')}catch(e){toast('Delen lukt hier niet, gebruik Print of PDF')}
 },
 csv:csv,
 cash2:()=>openCash(),
 scan:b=>openScan(b.dataset.f),
 paycard:b=>{setPay(b.dataset.src,b.dataset.id);openScan('pay')},
 code:()=>handleCode($('#cc').value),
 fincard:()=>finish(null),
 opencard:b=>openCard(b.dataset.id),
 ta:b=>{$('#ta').value=(b.dataset.v/100).toFixed(2).replace('.',',')},
 topup:b=>{const c=S.cards.find(x=>x.id===b.dataset.id),a=cents($('#ta').value);if(c.blocked){toast('Kaart is geblokkeerd');return}if(a<=0){toast('Kies of vul een bedrag in');return}c.bal+=a;S.tops.push({ts:Date.now(),card:c.id,amt:a,m:b.dataset.m,by:S.by});save();render();openCard(c.id);toast('Opgewaardeerd, saldo '+eur(c.bal))},
 blk:b=>{const c=S.cards.find(x=>x.id===b.dataset.id);c.blocked=c.blocked?0:1;save();render();openCard(c.id)},
 newcards:()=>sheet(`<h2>Nieuwe kaarten</h2><label for="nc">Hoeveel kaarten?</label><input class="f" id="nc" inputmode="numeric" value="12"><button class="big" data-act="mkcards">Maak aan en toon QR-codes</button>`),
 mkcards:()=>{const n=Math.min(60,Math.max(1,parseInt($('#nc').value)||1)),a=[];for(let i=0;i<n;i++){const id='BK-'+String(++S.cseq).padStart(4,'0');S.cards.push({id,bal:0,ts:Date.now()});a.push(id)}save();render();sheet(`<h2>${n} kaarten</h2><div class="bon pg qrs">${a.map(qrCell).join('')}</div><button class="big" data-act="print">Print of PDF</button><button class="ghost" data-act="close">Sluiten</button>`)},
 backup:()=>sheet(`<h2>Back-up</h2><p class="mu">Kopieer deze tekst en bewaar hem ergens veilig. Plak een eerdere back-up in het vak om te herstellen.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><button class="big" data-act="copybk">Kopieer</button><button class="big alt" data-act="restore">Herstel uit het vak</button>`),
 copybk:async()=>{const t=$('#bk');t.select();try{await navigator.clipboard.writeText(t.value);toast('Gekopieerd')}catch(e){toast('Houd de tekst ingedrukt om te kopiëren')}},
 restore:()=>{try{const o=JSON.parse($('#bk').value);if(!o.products)throw 0;S=o;fix();save();closeSheet();render();toast('Hersteld')}catch(e){toast('Dit is geen geldige back-up')}},
 copycsv:async()=>{const t=$('#csvt');t.select();try{await navigator.clipboard.writeText(t.value);toast('Gekopieerd')}catch(e){toast('Houd de tekst ingedrukt om te kopiëren')}},
 editp:b=>editP(b.dataset.id),
 savep:b=>{
  const n=$('#pn').value.trim();if(!n){toast('Vul een naam in');return}
  const o={name:n,price:cents($('#pp').value),cat:$('#pc').value.trim()||'Overig',on:$('#pv').checked?1:0};
  if(b.dataset.id==='new')S.products.push({id:'p'+(++S.nid),...o});else Object.assign(S.products.find(x=>x.id===b.dataset.id),o);
  save();closeSheet();render();
 },
 delp:b=>{const id=b.dataset.id;S.products=S.products.filter(x=>x.id!==id);delete cart[id];save();closeSheet();render()}
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const b=e.target.closest('[data-act]');if(b&&H[b.dataset.act])H[b.dataset.act](b);
});
document.addEventListener('change',e=>{
  if(e.target.id==='dd'){dd=e.target.value||day(Date.now());render()}
  if(e.target.id==='shop'){S.shop=e.target.value.trim()||'Bar';save()}
});
$('#by').value=S.by||'';
$('#by').addEventListener('input',e=>{S.by=e.target.value.trim();save()});
render();
</script></body></html>
